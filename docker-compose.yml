version: '3.8'

services:
  gphoto-sync:
    build: .
    container_name: gphoto-sync
    user: "1028:100"  # Match NAS user terry-linux (uid:gid)
    restart: unless-stopped

    ports:
      - "18080:8080"

    volumes:
      # Configuration and credentials
      - ./config:/config

      # SQLite database (persistent)
      - ./data:/data

      # Photos source - ENVIRONMENT SPECIFIC:
      # - Windows local: ./photos:/photos:ro (for testing)
      # - Windows network: Y:/:/photos:ro
      # - NAS production: /volume1/photo:/photos:ro
      #
      # NOTE: On NAS deployment, change this line manually or use docker-compose.override.yml
      - /volume1/photo:/photos:ro

    environment:
      - TZ=Australia/Perth
      - CONFIG_DIR=/config
      - DATA_DIR=/data
      - PHOTOS_DIR=/photos
      - LOG_LEVEL=INFO

    # Resource limits - removed, not supported on Synology kernel

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
