<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block refresh %}<meta http-equiv="refresh" content="30">{% endblock %}
<title>{{ "Photos OK" if s.ok else "Photos need you" }}</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f6f5; --panel: #ffffff; --ink: #17211d; --soft: #5c6a64; --line: #dde4e0;
    --good: #16794c; --bad: #b3261e; --bad-panel: #fdecea; --wait: #8a5a00; --move: #1f5fa8;
    --chart: #257de0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101513; --panel: #18201d; --ink: #e8efeb; --soft: #98a7a0; --line: #2a3531;
      --good: #5fd39b; --bad: #ff8a80; --bad-panel: #341a18; --wait: #f0b94e; --move: #7db4f5;
      --chart: #338ced;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 4rem; }
  nav { display: flex; gap: 1.25rem; padding: .5rem 0 1.25rem; }
  nav a { color: var(--soft); text-decoration: none; padding: .25rem 0; }
  nav a[aria-current] { color: var(--ink); font-weight: 600; box-shadow: 0 2px 0 var(--ink); }
  h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 1.05rem; margin: 2.25rem 0 .75rem; }
  .good { color: var(--good); } .bad { color: var(--bad); } .soft { color: var(--soft); }
  .beat { color: var(--soft); margin: .5rem 0 0; }
  .problem { background: var(--bad-panel); border-left: 4px solid var(--bad);
             border-radius: 6px; padding: .9rem 1.1rem; margin-top: 1rem; }
  .problem b { display: block; } .problem p { margin: .25rem 0 0; }
  a { color: inherit; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }

  .flow { display: grid; grid-template-columns: repeat(6, 1fr); margin: 1.75rem 0 0; padding: 0; list-style: none; }
  .flow li { position: relative; padding: 1rem .9rem; border-left: 1px solid var(--line); }
  .flow li:first-child { border-left: 0; }
  .flow li:not(:last-child)::after { content: ""; position: absolute; right: -6px; top: 1.45rem; width: 11px; height: 11px;
      background: var(--panel); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: rotate(45deg); z-index: 1; }
  .flow b { display: block; } .flow small { color: var(--soft); display: block; }
  .flow .count, .flow .state { display: block; }
  .flow .count { font-size: 1.5rem; font-weight: 600; min-height: 2.25rem; font-variant-numeric: tabular-nums; }
  .flow .state { font-size: .875rem; white-space: nowrap; }
  .flow small { min-height: 2.6em; line-height: 1.3; }
  .flow .stuck { background: var(--bad-panel); }

  .todo { list-style: none; margin: 1rem 0 0; padding: 1rem 1.25rem; }
  .todo li { padding: .35rem 0 .35rem 1.9rem; position: relative; }
  .todo li::before { content: "○"; position: absolute; left: .25rem; color: var(--soft); }
  .todo li.done { color: var(--soft); } .todo li.done::before { content: "✓"; color: var(--good); }
  .todo small { display: block; color: var(--soft); }

  .find { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 .75rem; }
  input, select, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
      border-radius: 6px; padding: .4rem .7rem; }
  input[type=search] { flex: 1 1 14rem; min-width: 0; }
  button { cursor: pointer; } button:hover, nav a:hover { color: var(--ink); border-color: var(--soft); }
  :focus-visible { outline: 2px solid var(--move); outline-offset: 2px; }
  td form { display: inline; } td button { padding: .1rem .5rem; font-size: .875rem; }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .55rem 1rem; white-space: nowrap; vertical-align: top; }
  th { color: var(--soft); font-weight: 500; border-bottom: 1px solid var(--line); }
  tr + tr td { border-top: 1px solid var(--line); }
  td small { color: var(--soft); display: block; white-space: normal; }
  .stage { font-weight: 600; }
  .stage.waiting { color: var(--wait); } .stage.way { color: var(--move); }
  .stage.in { color: var(--good); } .stage.failed { color: var(--bad); } .stage.skipped { color: var(--soft); }
  .empty { padding: 1.5rem 1.25rem; margin: 0; color: var(--soft); }
  .pager { display: flex; gap: 1rem; align-items: center; margin-top: .75rem; color: var(--soft); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .75rem; }
  .tile { padding: 1rem 1.1rem; }
  .tile b { display: block; font-size: 1.6rem; font-weight: 600; line-height: 1.2; }
  .tile span, .tile small { color: var(--soft); display: block; }
  .tile svg { display: block; width: 100%; height: 36px; margin-top: .4rem; }
  .spark { fill: none; stroke: var(--chart); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .days { display: block; width: 100%; height: auto; padding: 1rem; }
  .days rect.bar { fill: var(--chart); } .days rect.hit { fill: transparent; } .days g:hover .bar { opacity: .75; }
  .days text { fill: var(--soft); font-size: 11px; } .days line { stroke: var(--line); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: .75rem; }
  .facts section { padding: 1rem 1.1rem; } .facts h3 { margin: 0 0 .4rem; font-size: 1rem; }
  .facts dl { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; margin: 0; }
  .facts dt { color: var(--soft); } .facts dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  @media (max-width: 48rem) {
    .flow { grid-template-columns: 1fr; }
    .flow li { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 0 1rem; padding: .7rem 1rem; }
    .flow li:first-child { border-top: 0; } .flow li::after { display: none; }
    .flow .count { grid-row: 1 / 4; grid-column: 2; align-self: center; } .flow small { min-height: 0; }
    th, td { padding: .5rem .7rem; } .wide { display: none; }
  }
</style>
</head>
<body>
<main>
  <nav aria-label="Pages">
    <a href="/" {% if here == "photos" %}aria-current="page"{% endif %}>Photos</a>
    <a href="/history" {% if here == "history" %}aria-current="page"{% endif %}>History</a>
    <a href="/ops" {% if here == "ops" %}aria-current="page"{% endif %}>Ops</a>
  </nav>
  {% block body %}{% endblock %}
</main>
</body>
</html>
