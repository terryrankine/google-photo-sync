# Docker Compose for Windows
# Usage: docker-compose -f docker-compose.windows.yml up -d

version: '3.8'

services:
  gphoto-sync:
    build: .
    container_name: gphoto-sync
    restart: unless-stopped

    ports:
      - "18080:8080"

    volumes:
      # Config and data directories (persistent)
      - ./config:/config
      - ./data:/data

      # Test photos (local) - change to NAS path when running on NAS
      # For Docker Desktop on Windows, network drives don't work
      # Options: 1) Run on NAS, 2) Use SMB mount inside container, 3) Copy locally
      - ./test_photos:/photos:ro
      # - Y:/:/photos:ro  # Won't work with Docker Desktop

    environment:
      # Perth timezone (W. Australia Standard Time)
      - TZ=Australia/Perth
      - CONFIG_DIR=/config
      - DATA_DIR=/data
      - PHOTOS_DIR=/photos
      - LOG_LEVEL=INFO
      # Windows-specific: Disable file watching (uses polling instead)
      - WATCHFILES_FORCE_POLLING=true

    # Windows Docker Desktop resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
