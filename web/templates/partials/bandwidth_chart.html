<!-- Bandwidth/Data Movement Chart -->
<div class="relative h-48">
    <canvas id="bandwidthChart"></canvas>
</div>

<script>
(function() {
    const ctx = document.getElementById('bandwidthChart').getContext('2d');

    // Data from server
    const chartData = {{ bandwidth_data | tojson | safe }};

    // Gradient for upload area
    const uploadGradient = ctx.createLinearGradient(0, 0, 0, 200);
    uploadGradient.addColorStop(0, 'rgba(34, 197, 94, 0.4)');
    uploadGradient.addColorStop(1, 'rgba(34, 197, 94, 0.0)');

    const config = {
        type: 'line',
        data: {
            labels: chartData.labels,
            datasets: [
                {
                    label: 'Data Uploaded',
                    data: chartData.uploaded_mb,
                    borderColor: 'rgb(34, 197, 94)',
                    backgroundColor: uploadGradient,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                },
                {
                    label: 'Data Read',
                    data: chartData.read_mb,
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'transparent',
                    borderDash: [5, 5],
                    tension: 0.3,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        color: 'rgb(156, 163, 175)',
                        usePointStyle: true,
                    }
                },
                tooltip: {
                    backgroundColor: 'rgb(31, 41, 55)',
                    titleColor: 'rgb(243, 244, 246)',
                    bodyColor: 'rgb(156, 163, 175)',
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) {
                                label += ': ';
                            }
                            // Format as MB or GB
                            const value = context.parsed.y;
                            if (value >= 1024) {
                                label += (value / 1024).toFixed(2) + ' GB';
                            } else {
                                label += value.toFixed(1) + ' MB';
                            }
                            return label;
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: {
                        color: 'rgba(75, 85, 99, 0.3)',
                    },
                    ticks: {
                        color: 'rgb(156, 163, 175)',
                    }
                },
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(75, 85, 99, 0.3)',
                    },
                    ticks: {
                        color: 'rgb(156, 163, 175)',
                        callback: function(value) {
                            if (value >= 1024) {
                                return (value / 1024).toFixed(1) + ' GB';
                            }
                            return value + ' MB';
                        }
                    }
                }
            }
        }
    };

    new Chart(ctx, config);
})();
</script>
