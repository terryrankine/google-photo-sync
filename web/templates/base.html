<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Google Photos Sync{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        [x-cloak] { display: none !important; }
        .progress-bar {
            transition: width 0.3s ease-in-out;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-white">
                        GPhoto Sync
                    </a>
                    <div class="flex space-x-4">
                        <a href="/" class="px-3 py-2 rounded-md text-sm font-medium
                            {% if active_page == 'home' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                            Dashboard
                        </a>
                        <a href="/batches" class="px-3 py-2 rounded-md text-sm font-medium
                            {% if active_page == 'batches' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                            Batches
                        </a>
                        <a href="/stats" class="px-3 py-2 rounded-md text-sm font-medium
                            {% if active_page == 'stats' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                            Statistics
                        </a>
                        <a href="/files" class="px-3 py-2 rounded-md text-sm font-medium
                            {% if active_page == 'files' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                            Files
                        </a>
                        <a href="/config" class="px-3 py-2 rounded-md text-sm font-medium
                            {% if active_page == 'config' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                            Settings
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- Status indicator -->
                    <div id="status-indicator" hx-get="/api/status" hx-trigger="every 5s" hx-swap="innerHTML">
                        <span class="flex items-center text-sm">
                            <span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>
                            Idle
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between text-sm text-gray-400">
                <span>Google Photos Sync Tool</span>
                <span id="db-size" hx-get="/api/db-size" hx-trigger="every 30s" hx-swap="innerHTML">
                    DB: Loading...
                </span>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
